<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sky-glow { animation: skyPulse 9s ease-in-out infinite alternate; transform-origin: 50% 30%; }
      .city-layer { animation: cityDrift 18s ease-in-out infinite alternate; transform-origin: center; }
      .data-stream { stroke-dasharray: 24 34; animation: streamFlow 5.5s linear infinite; }
      .data-stream.alt { animation-duration: 7s; animation-direction: reverse; }
      .server-light { animation: lightPulse 2.8s ease-in-out infinite; }
      .server-light:nth-of-type(2) { animation-delay: -0.7s; }
      .server-light:nth-of-type(3) { animation-delay: -1.4s; }
      .server-light:nth-of-type(4) { animation-delay: -2.1s; }
      .connection-node { animation: nodePulse 3.4s ease-in-out infinite; transform-origin: center; }
      .connection-node:nth-of-type(2n) { animation-delay: -1.5s; }
      @keyframes skyPulse {
        from { opacity: 0.78; transform: scale(1); }
        to { opacity: 1; transform: scale(1.04); }
      }
      @keyframes cityDrift {
        from { transform: translate3d(-10px, 0, 0); }
        to { transform: translate3d(10px, -6px, 0); }
      }
      @keyframes streamFlow {
        from { stroke-dashoffset: 0; opacity: 0.28; }
        50% { opacity: 0.78; }
        to { stroke-dashoffset: -116; opacity: 0.42; }
      }
      @keyframes lightPulse {
        0%, 100% { opacity: 0.35; }
        45% { opacity: 1; }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.45; r: 5; }
        50% { opacity: 1; r: 8; }
      }
    </style>
    <radialGradient id="skyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 220) rotate(90) scale(650 1040)">
      <stop stop-color="#3343ff" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="250" x2="0" y2="970" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#020617"/>
  <rect class="sky-glow" width="1920" height="1080" fill="url(#skyGlow)"/>

  <g class="city-layer" opacity="0.28">
    <path d="M0 220H1920M0 320H1920M0 420H1920M0 520H1920M0 620H1920M0 720H1920M0 820H1920M0 920H1920" stroke="#60a5fa" stroke-width="1"/>
    <path d="M120 0V1080M240 0V1080M360 0V1080M480 0V1080M600 0V1080M720 0V1080M840 0V1080M960 0V1080M1080 0V1080M1200 0V1080M1320 0V1080M1440 0V1080M1560 0V1080M1680 0V1080M1800 0V1080" stroke="#818cf8" stroke-width="1"/>
  </g>

  <g opacity="0.42" filter="url(#softGlow)">
    <path class="data-stream" d="M110 755C310 640 390 850 570 710C760 560 850 420 1045 545C1240 670 1320 330 1510 445C1660 535 1740 455 1840 355" stroke="#38bdf8" stroke-width="3"/>
    <path class="data-stream alt" d="M70 450C260 350 430 500 640 380C820 276 980 330 1120 250C1320 135 1530 310 1850 170" stroke="#a855f7" stroke-width="2"/>
  </g>

  <g class="city-layer" opacity="0.78">
    <rect x="126" y="530" width="120" height="390" rx="12" fill="url(#tower)" stroke="#334155"/>
    <rect x="286" y="460" width="148" height="460" rx="14" fill="url(#tower)" stroke="#334155"/>
    <rect x="482" y="590" width="96" height="330" rx="10" fill="url(#tower)" stroke="#334155"/>
    <rect x="1310" y="500" width="130" height="420" rx="14" fill="url(#tower)" stroke="#334155"/>
    <rect x="1480" y="415" width="170" height="505" rx="16" fill="url(#tower)" stroke="#334155"/>
    <rect x="1690" y="570" width="108" height="350" rx="12" fill="url(#tower)" stroke="#334155"/>
  </g>

  <g opacity="0.85">
    <rect x="710" y="470" width="500" height="430" rx="22" fill="#020617" stroke="#475569" stroke-width="2"/>
    <rect x="750" y="520" width="420" height="62" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="750" y="612" width="420" height="62" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="750" y="704" width="420" height="62" rx="10" fill="#0f172a" stroke="#334155"/>
    <rect x="750" y="796" width="420" height="62" rx="10" fill="#0f172a" stroke="#334155"/>

    <circle class="server-light" cx="800" cy="551" r="8" fill="#22c55e" filter="url(#softGlow)"/>
    <circle class="server-light" cx="800" cy="643" r="8" fill="#38bdf8" filter="url(#softGlow)"/>
    <circle class="server-light" cx="800" cy="735" r="8" fill="#a855f7" filter="url(#softGlow)"/>
    <circle class="server-light" cx="800" cy="827" r="8" fill="#22c55e" filter="url(#softGlow)"/>
    <path d="M842 551H1130M842 643H1130M842 735H1130M842 827H1130" stroke="url(#glass)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g opacity="0.65">
    <path class="data-stream" d="M246 620H530V545H710" stroke="#38bdf8" stroke-width="2"/>
    <path class="data-stream alt" d="M1210 610H1385V520H1580" stroke="#a855f7" stroke-width="2"/>
    <path class="data-stream alt" d="M360 830H620V765H750" stroke="#818cf8" stroke-width="2"/>
    <path class="data-stream" d="M1170 810H1340V735H1480" stroke="#38bdf8" stroke-width="2"/>
    <circle class="connection-node" cx="530" cy="545" r="6" fill="#38bdf8"/>
    <circle class="connection-node" cx="1385" cy="520" r="6" fill="#a855f7"/>
    <circle class="connection-node" cx="620" cy="765" r="6" fill="#818cf8"/>
    <circle class="connection-node" cx="1340" cy="735" r="6" fill="#38bdf8"/>
  </g>

  <g opacity="0.44">
    <rect x="0" y="900" width="1920" height="180" fill="#020617"/>
    <path d="M0 900H1920" stroke="#334155" stroke-width="2"/>
    <path d="M0 970H1920" stroke="#0f172a" stroke-width="12"/>
  </g>
</svg>
